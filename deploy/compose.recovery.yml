# Complemento de compose.smoke.yml, somente por scripts/recovery.py (dados sintéticos).
services:
  restore-db:
    profiles: [recovery]
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    environment:
      POSTGRES_DB: flagpilot
      POSTGRES_USER: flagpilot_migrator
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${RESTORE_APP_DB_PASSWORD:?}
    volumes:
      - restore-pgdata:/var/lib/postgresql/data
      - ./postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U flagpilot_migrator -d flagpilot']
      interval: 2s
      timeout: 2s
      retries: 30
  restore-api:
    profiles: [recovery]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: test
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://flagpilot_app:${RESTORE_APP_DB_PASSWORD:?}@restore-db:5432/flagpilot?sslmode=disable
    ports: ["127.0.0.1::8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      restore-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /healthcheck]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  restore-pgdata:
