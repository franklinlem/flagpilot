name: flagpilot-dev
services:
  db:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flagpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flagpilot_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute make setup}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Execute make setup}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  migrate:
    build:
      context: ..
      dockerfile: deploy/migrate/Dockerfile
    profiles: [tools, full]
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-flagpilot_migrator}:${POSTGRES_PASSWORD:?Execute make setup}@db:5432/${POSTGRES_DB:-flagpilot}?sslmode=disable
    volumes:
      - ../db/migrations:/migrations:ro
    depends_on:
      db: {condition: service_healthy}
  api:
    profiles: [full]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: 0.0.0.0:8080
      METRICS_ADDR: 0.0.0.0:9090
      DATABASE_URL: postgres://flagpilot_app:${APP_DB_PASSWORD:?Execute make setup}@db:5432/${POSTGRES_DB:-flagpilot}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SESSION_TTL: ${SESSION_TTL:-12h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_TIMEOUT: ${DB_TIMEOUT:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, /healthcheck]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    profiles: [full]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      API_PROXY_TARGET: http://api:8080
      WEB_PORT: "5173"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
