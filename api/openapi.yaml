        rolloutBps:
          type: integer
          minimum: 0
          maximum: 10000
        version:
          type: integer
          format: int64
          minimum: 1
        revision: *id006
      required:
      - flagKey
      - environmentId
      - enabled
      - rolloutBps
      - version
      - revision
    UpdateFlagConfig:
