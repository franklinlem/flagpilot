              type: string
              minLength: 1
              maxLength: 256
              description: Até 256 bytes UTF-8; somente em memória, sem logs.
      required:
      - flagKey
      examples:
      - flagKey: new_admin_dashboard
        context:
          bucketingKey: pseudonymous-user-123
    EvaluationResult:
      type: object
      additionalProperties: false
      properties:
