          - MISSING_CONTEXT
          - NOT_FOUND
        environment: *id005
        revision: *id006
      required:
      - flagKey
      - value
      - reason
      - environment
      - revision
      examples:
      - flagKey: new_admin_dashboard
        value: true
        reason: PERCENTAGE_ROLLOUT
        environment: production
        revision: 18
