components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: flagpilot_session
    evaluationToken:
      type: http
      scheme: bearer
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *id002
      description: Obrigatório em mutações autenticadas por cookie; validar também
        Origin.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: *id002
      description: 'ETag forte recebido na leitura. Ausente: 428; precondição falsa:
        412; conflito de domínio: 409.'
  responses:
    Problem:
      description: Erro padronizado, sem segredos ou detalhes internos
      headers:
        X-Request-ID:
          schema: *id002
          description: Identificador opaco da requisição
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos sugeridos em respostas 429.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
      examples:
      - status: ok
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title: *id002
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail: *id002
        instance:
          type: string
          format: uri-reference
        requestId: *id002
      required:
      - type
      - title
      - status
      - detail
      - instance
      - requestId
      examples:
      - type: about:blank
        title: Serviço indisponível
        status: 503
        detail: Serviço indisponível
        instance: urn:request:70ad6dac6c08488588b69de6d4898119
        requestId: 70ad6dac6c08488588b69de6d4898119
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: Até 256 bytes UTF-8; senhas de bootstrap/recuperação têm mínimo
            de 12 caracteres.
      required:
      - email
      - password
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        email:
          type: string
          format: email
        createdAt: &id007
          type: string
          format: date-time
      required:
      - id
      - email
      - createdAt
    Role:
      type: string
      enum:
      - Owner
      - Admin
      - Editor
      - Viewer
    Me:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/ProfileMembership'
        csrfToken: *id002
      required:
      - user
      - memberships
      - csrfToken
      description: Sessão administrativa atual. CSRF derivado da sessão, mantido apenas
        em memória e enviado no header X-CSRF-Token em mutações.
    MemberRequest:
      type: object
      additionalProperties: false
      properties:
        userId: *id001
        role:
          $ref: '#/components/schemas/Role'
      required:
      - userId
      - role
    RoleRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
      required:
      - role
    Organization:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: &id004
          type: string
          minLength: 1
          maxLength: 200
        slug: &id005
          type: string
          pattern: ^[a-z][a-z0-9-]{1,62}$
          maxLength: 63
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - name
      - slug
      - role
    Project:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id004
        slug: *id005
        organizationId: *id001
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - name
      - slug
      - organizationId
      - role
    Environment:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id004
        slug: *id005
        projectId: *id001
        isProduction:
          type: boolean
        revision: &id006
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - name
      - slug
      - projectId
      - revision
      - isProduction
    NamedRequest:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        slug: *id005
      required:
      - name
      - slug
      examples:
      - name: Meu projeto
        slug: meu-projeto
    Flag:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        projectId: *id001
        key: *id003
        description:
          type: string
          maxLength: 2000
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
      required:
      - id
      - projectId
      - key
      - description
      - archivedAt
      - version
    CreateFlag:
      type: object
      additionalProperties: false
      properties:
        key: *id003
        description:
          type: string
          maxLength: 2000
          default: ''
      required:
      - key
    UpdateFlag:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 2000
        archived:
          type: boolean
          const: true
        confirmProduction:
          type: boolean
          default: false
      anyOf:
      - required: [description]
      - required: [archived]
