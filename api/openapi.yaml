          enum: [user, local-operator, unknown]
        action: *id002
        resourceType: *id002
        resourceId: *id001
        before:
          type:
          - object
          - 'null'
          additionalProperties:
            type: [string, number, boolean, 'null']
        after:
          type:
          - object
          - 'null'
          additionalProperties:
            type: [string, number, boolean, 'null']
        createdAt: *id007
      required:
