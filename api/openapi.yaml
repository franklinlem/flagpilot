          minimum: 1
          maximum: 100
          default: 25
    post:
      operationId: addMember
      summary: Associar usuário existente
      description: 'Disponível no incremento 2B. Permissão: Owner. Somente Owner.
        Preservar ao menos um Owner ativo; conflito retorna 409. Mutação e auditoria
        na mesma transação. Remoção/papel afeta esta organização, sem revogar sessões
