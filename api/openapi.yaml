    AuditEvent:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        organizationId: *id001
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        action: *id002
        resourceType: *id002
        resourceId: *id001
        before:
          type:
          - object
          - 'null'
          additionalProperties: true
        after:
          type:
          - object
          - 'null'
          additionalProperties: true
        createdAt: *id007
      required:
