openapi: 3.1.0
info:
  title: FlagPilot API
  version: 0.0.0
  description: Contrato incremental. Health, autenticação e organizações/membros estão
    implementados; x-implementation identifica o restante planejado. Bootstrap, cadastro
    local de usuários e recuperação são CLI, sem signup público.
  contact:
    name: FlagPilot
    url: https://github.com/franklinlem/flagpilot
servers:
- url: /api/v1
  description: API mesma origem
tags:
- name: Operação
  description: Operação
- name: Autenticação
  description: Autenticação
- name: Organizações
  description: Organizações
- name: Projetos
  description: Projetos
- name: Flags
  description: Flags
- name: Tokens
  description: Tokens
- name: Auditoria
  description: Auditoria
- name: Avaliação
  description: Avaliação
paths:
  /health/live:
    get:
      operationId: liveness
      summary: Verificar processo
      description: Disponível na fundação.
      tags:
      - Operação
      x-implementation: available
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      summary: Verificar banco e schema
      description: Disponível na fundação. Acessível somente por loopback/rede interna;
        bloquear na borda pública.
      tags:
      - Operação
      x-implementation: available
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sessão administrativa
      description: 'Disponível desde o incremento 2A. Validar Origin/Fetch Metadata
        e exigir application/json contra login CSRF. Cookie HttpOnly, SameSite e Secure
        em HTTPS. Exige Origin exata permitida e application/json, rejeita Sec-Fetch-Site
        cross-site. Rotaciona cookie e revoga sessão anterior. Limites: 10 tentativas
        por IP/conta a cada 15min e 120/min global, duas verificações Argon2 concorrentes
        por réplica. Sem confiança em X-Forwarded-For.'
      tags:
      - Autenticação
      x-implementation: available
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            Set-Cookie:
              description: Sessão opaca rotacionada, HttpOnly; nunca retornar token
                de sessão no JSON.
              schema: &id002
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      summary: Revogar sessão
      description: Disponível desde o incremento 2A.
      tags:
      - Autenticação
      x-implementation: available
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Operação concluída
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /me:
    get:
      operationId: me
      summary: Consultar perfil, permissões e CSRF
      description: Disponível desde o incremento 2A.
      tags:
      - Autenticação
      x-implementation: available
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /organizations:
    get:
      operationId: listOrganizations
      summary: Listar organizações autorizadas
      description: Disponível no incremento 2B.
      tags:
