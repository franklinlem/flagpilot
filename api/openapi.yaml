  /projects/{projectId}/flags:
    get:
      operationId: listFlags
      summary: Listar flags
      description: 'Disponível em 3B/6A. Viewer+. Busca literal pela chave (normalizada em minúsculas), estado do catálogo e paginação vinculada ao usuário/projeto/filtros. Duplicatas de filtros são inválidas.'
      tags:
      - Flags
      x-implementation: available
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagPage'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
