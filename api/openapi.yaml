openapi: 3.1.0
info:
  title: FlagPilot API
  version: 0.0.0
  description: Contrato incremental. Somente live/ready estão implementados; x-implementation
    identifica os demais. Bootstrap e recuperação administrativa serão CLI, sem endpoint
    público. Sem hard delete de domínio no MVP.
  contact:
    name: FlagPilot
    url: https://github.com/franklinlem/flagpilot
servers:
- url: /api/v1
  description: API mesma origem
tags:
- name: Operação
  description: Operação
- name: Autenticação
  description: Autenticação
- name: Organizações
  description: Organizações
- name: Projetos
  description: Projetos
- name: Flags
  description: Flags
- name: Tokens
  description: Tokens
- name: Auditoria
  description: Auditoria
- name: Avaliação
  description: Avaliação
paths:
  /health/live:
    get:
      operationId: liveness
      summary: Verificar processo
      description: Disponível na fundação.
      tags:
      - Operação
      x-implementation: available
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      summary: Verificar banco e schema
      description: Disponível na fundação. Acessível somente por loopback/rede interna;
        bloquear na borda pública.
      tags:
      - Operação
      x-implementation: available
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sessão administrativa
      description: Contrato planejado; endpoint ainda não implementado. Validar Origin/Fetch
        Metadata e exigir application/json contra login CSRF. Cookie HttpOnly, SameSite
        e Secure em HTTPS.
      tags:
      - Autenticação
      x-implementation: planned
      security: []
      responses:
        '200':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            Set-Cookie:
              description: Sessão opaca rotacionada, HttpOnly; nunca retornar token
                de sessão no JSON.
              schema: &id002
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
