      examples:
      - enabled: true
        rolloutBps: 10000
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        expiresAt: *id007
      required:
      - name
      - expiresAt
    Token:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        environmentId: *id001
        name: *id004
        prefix: *id002
        expiresAt: *id007
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - environmentId
      - name
      - prefix
      - expiresAt
      - revokedAt
    IssuedToken:
      type: object
      additionalProperties: false
