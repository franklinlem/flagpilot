      - name: projectId
        in: path
        required: true
        schema: *id001
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: q
        in: query
        description: Substring literal da chave; trim/minúsculas, até 80 caracteres ASCII de chave.
        schema:
          type: string
          maxLength: 80
      - name: status
        in: query
        schema:
          type: string
          enum: [all, active, archived]
          default: all
    post:
      operationId: createFlag
      summary: Criar flag desativada nos ambientes
      description: 'Disponível no incremento 3B. Permissão:
        Editor+.'
      tags:
      - Flags
      x-implementation: available
      security:
      - sessionCookie: []
      responses:
        '201':
          description: Operação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          headers:
            ETag:
              description: ETag forte da representação; reenviar em If-Match. Reenviar o valor exato de uma leitura recente; sem wildcard ou lista.
              schema: *id002
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
